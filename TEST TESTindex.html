<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wer ist dran?</title>
  <style>
    /* Aussehen der Seite */
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { color: #333; }
    #ergebnis {
      font-size: 2.5rem;
      font-weight: bold;
      color: #4a6cf7;
      margin: 30px 0;
      min-height: 3rem;
    }
    button {
      font-size: 1.2rem;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      background: #4a6cf7;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #3651c9; }
  </style>
</head>
<body>

  <h1>Wer präsentiert heute?</h1>
  <div id="ergebnis">?</div>
  <button onclick="auswaehlen()">Zufällig auswählen</button>

  <script>
    // Hier tragt ihr eure eigenen Namen ein
    const gruppe = ["Anna", "Ben", "Clara", "David"];

    // Diese Funktion wird beim Klick auf den Button ausgeführt
    function auswaehlen() {
      const zufall = Math.floor(Math.random() * gruppe.length);
      document.getElementById("ergebnis").textContent = gruppe[zufall];
    }
  </script>

</body>
</html>
